<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Untukku 💌</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5efff;
    }

    .container {
      width: 90%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      height: 140px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #8b6cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💌 Pesan Untukku</h1>

    <p>Tulis pesan apa pun yang ingin kamu sampaikan.</p>

    <form action="https://formspree.io/f/maeylnnr" method="POST">

      <label>Nama</label>
      <input type="text" name="nama" placeholder="Nama kamu" required>

      <label>Pesan</label>
      <textarea name="pesan" placeholder="Tulis pesan di sini..." required></textarea>

      <button type="submit">Kirim Pesan 💌</button>

    </form>

  </div>

</body>
</html>
