<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pesan Untuk Zahira 🐬🌊</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          rgba(120, 210, 245, 0.55),
          rgba(20, 130, 190, 0.55)
        ),
        url("lumbalumba.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      padding: 20px;
    }

    .container {
      width: 90%;
      max-width: 450px;

      background: rgba(255, 255, 255, 0.93);

      padding: 30px;

      border-radius: 25px;

      box-shadow:
        0 15px 40px rgba(0, 80, 140, 0.30);
    }

    .ocean {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
      letter-spacing: 5px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 10px;

      color: #0879b9;
      font-size: 28px;
    }

    p {
      text-align: center;
      color: #527080;

      margin-bottom: 25px;

      line-height: 1.6;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;
      color: #0879b9;
    }

    input,
    textarea {
      width: 100%;

      padding: 12px;

      margin-bottom: 18px;

      border: 2px solid #b5e5f7;
      border-radius: 12px;

      font-size: 15px;

      background: #f5fcff;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #35aee0;
    }

    textarea {
      height: 140px;
      resize: none;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;
      border-radius: 15px;

      background: #149bd7;

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #0879b9;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #status {
      text-align: center;

      margin-top: 15px;

      color: #0879b9;

      display: none;
    }

    .bottom-ocean {
      text-align: center;

      margin-top: 20px;

      font-size: 25px;

      letter-spacing: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="ocean">
      🐬🌊🫧
    </div>

    <h1>
      🐬 Pesan Untuk Zahira 🌊
    </h1>

    <p>
      Tulis pesan apa pun yang ingin kamu sampaikan. 💙
      <br>
      Pesanmu akan berenang sampai kepada Zahira. 🐬🫧
    </p>

    <form
      action="https://formspree.io/f/maeylnnr"
      method="POST"
      id="messageForm"
    >

      <label>
        🐬 Nama
      </label>

      <input
        type="text"
        name="nama"
        placeholder="Nama kamu 🐟"
        required
      >

      <label>
        🌊 Pesan
      </label>

      <textarea
        name="pesan"
        placeholder="Tulis pesan di sini... 🫧🐚"
        required
      ></textarea>

      <button
        type="submit"
        id="submitButton"
      >
        🐬 Kirim Pesan 🌊
      </button>

      <div id="status">
        🫧 Sedang mengirim pesan... 🐬🌊
      </div>

    </form>

    <div class="bottom-ocean">
      🐚 🐟 🫧 🌊 🐬 💙
    </div>

  </div>

  <script>

    const form = document.getElementById("messageForm");

    const button = document.getElementById("submitButton");

    const status = document.getElementById("status");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      button.disabled = true;

      button.textContent = "🐬 Mengirim... 🌊";

      status.style.display = "block";


      try {

        const response = await fetch(form.action, {

          method: "POST",

          body: new FormData(form),

          headers: {
            "Accept": "application/json"
          }

        });


        if (response.ok) {

          window.location.href = "thanks.html";

        } else {

          throw new Error("Gagal mengirim pesan");

        }


      } catch (error) {

        status.textContent =
          "🌊 Pesan gagal dikirim 😢 Coba lagi ya, 🐬";

        button.disabled = false;

        button.textContent = "🐬 Kirim Pesan 🌊";

      }

    });

  </script>

</body>
</html>
