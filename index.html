<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Untukku 💌</title>

  <style>
    body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;

  background: #dff3ff url("lumbalumba.jpg") center/cover fixed;
}

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

  background:
    linear-gradient(rgba(210, 240, 255, 0.55), rgba(210, 240, 255, 0.55)),
    url("lumbalumba.jpg");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

    .container {
      width: 90%;
      max-width: 450px;
      background: rgba(255, 255, 255, 0.92);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      height: 140px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #8b6cff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #d94f70;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💌 Pesan Untukku</h1>

    <p>Tulis pesan apa pun yang ingin kamu sampaikan.</p>

    <form
      action="https://formspree.io/f/maeylnnr"
      method="POST"
      id="messageForm"
    >

      <label>Nama</label>
      <input
        type="text"
        name="nama"
        placeholder="Nama kamu"
        required
      >

      <label>Pesan</label>
      <textarea
        name="pesan"
        placeholder="Tulis pesan di sini..."
        required
      ></textarea>

      <button type="submit" id="submitButton">
        Kirim Pesan 💌
      </button>

      <div id="status">
        Sedang mengirim pesan... 💌
      </div>

    </form>

  </div>

  <script>
    const form = document.getElementById("messageForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Mengirim... 💌";
      status.style.display = "block";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.ok) {
          window.location.href = "thanks.html";
        } else {
          throw new Error("Gagal mengirim pesan");
        }

      } catch (error) {
        status.textContent =
          "Yah, pesan gagal dikirim 😢 Coba lagi ya.";

        button.disabled = false;
        button.textContent = "Kirim Pesan 💌";
      }
    });
  </script>

</body>
</html>
