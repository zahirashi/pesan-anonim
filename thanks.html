<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Terkirim 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe5ec, #fff5f7);
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 45px 30px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(180, 100, 120, 0.2);
    }

    .heart {
      font-size: 70px;
      animation: beat 1.2s infinite;
    }

    h1 {
      margin: 15px 0 10px;
      color: #d94f70;
      font-size: 32px;
    }

    p {
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #e87591;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .back:hover {
      background: #d95d7b;
      transform: translateY(-2px);
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 22px;
      animation: float 6s linear infinite;
      opacity: 0.7;
    }

    .h1 { left: 10%; animation-delay: 0s; }
    .h2 { left: 30%; animation-delay: 2s; }
    .h3 { left: 60%; animation-delay: 1s; }
    .h4 { left: 85%; animation-delay: 3s; }

    @keyframes float {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.7;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="floating-heart h1">💗</div>
  <div class="floating-heart h2">💖</div>
  <div class="floating-heart h3">💌</div>
  <div class="floating-heart h4">💕</div>

  <div class="card">
    <div class="heart">💌</div>

    <h1>Pesanmu sudah sampai!</h1>

    <p>
      Terima kasih sudah mengirim pesan.
      <br>
      Pesanmu sudah berhasil diterima dengan aman ❤️
    </p>

    <a class="back" href="index.html">
      ← Kirim pesan lagi
    </a>
  </div>

</body>
</html>
