<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Terkirim 🐬💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background:
        linear-gradient(rgba(180, 225, 250, 0.65), rgba(180, 225, 250, 0.65)),
        url("lumbalumba.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 20px;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 40px 30px;
      text-align: center;

      background: rgba(255, 255, 255, 0.92);
      border-radius: 25px;

      box-shadow: 0 15px 40px rgba(40, 120, 180, 0.25);
    }

    .dolphin {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
      color: #287fbd;
      font-size: 30px;
    }

    p {
      color: #5d7180;
      font-size: 17px;
      line-height: 1.6;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;

      background: #4da6e8;
      color: white;

      text-decoration: none;
      border-radius: 30px;
      transition: 0.3s;
    }

    .back:hover {
      background: #287fbd;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="dolphin">
      🐬🌊💙🫧
    </div>

    <h1>
      🐬 Pesanmu sudah sampai! 🌊
    </h1>

    <p>
      Terima kasih sudah mengirim pesan. 💙
      <br>
      Pesanmu sudah berenang sampai dengan aman. 🐬🫧
      <br>
      🌊🐟🐚💙
    </p>

    <a class="back" href="index.html">
      🐬 Kirim pesan lagi 💙
    </a>

  </div>

</body>
</html>
